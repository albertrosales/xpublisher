<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TweetGen — @Mastv_hn</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #111; --surface2: #181818;
  --border: #1e1e1e; --border2: #2a2a2a;
  --text: #f0f0f0; --muted: #555; --muted2: #333;
  --accent: #e7ff52; --accent-dim: #c8e030;
  --success: #22c55e; --danger: #ef4444; --warning: #f59e0b;
  --radius: 12px; --radius-sm: 7px;
}
body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; line-height: 1.6; min-height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.brand-icon svg { width: 16px; height: 16px; fill: #000; }
.brand-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; }
.brand-sub { font-size: 11px; color: var(--muted); }
.layout { display: flex; min-height: calc(100vh - 57px); overflow: hidden; }
.sidebar { border-right: 1px solid var(--border); padding: 16px 0; width: 200px; flex-shrink: 0; overflow-y: auto; height: calc(100vh - 57px); }
.nav-section { font-size: 10px; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.1em; padding: 14px 16px 5px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 16px; cursor: pointer; color: var(--muted); font-size: 13px; border-left: 2px solid transparent; transition: all 0.12s; }
.nav-item:hover { color: var(--text); background: var(--surface); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: #0d1000; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.feed-sidebar-item { display: flex; align-items: center; gap: 6px; padding: 6px 16px 6px 20px; font-size: 11px; color: var(--muted); }
.feed-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.main-area { padding: 20px 24px; overflow-y: auto; flex: 1; min-width: 0; height: calc(100vh - 57px); }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; border: 1px solid var(--border2); background: var(--surface); color: var(--text); transition: all 0.12s; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
.btn-accent:hover { background: var(--accent-dim); }
.sort-select { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 7px 10px; cursor: pointer; outline: none; }
.count-badge { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
.news-grid { display: flex; flex-direction: column; gap: 8px; }
.news-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; transition: border-color 0.12s, background 0.12s; overflow: hidden; }
.news-card:hover { border-color: var(--border2); background: var(--surface2); }
.news-card.selected { border-color: var(--accent); background: #0d1000; }
.news-card-inner { display: flex; }
.news-thumb { width: 80px; min-height: 70px; object-fit: cover; flex-shrink: 0; }
.news-thumb-ph { width: 80px; min-height: 70px; flex-shrink: 0; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--muted2); font-size: 20px; }
.news-body { padding: 10px 12px; flex: 1; min-width: 0; }
.news-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 500; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-desc { font-size: 11px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
.news-meta { font-size: 10px; color: var(--muted2); }
.panel { border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; min-width: 240px; max-width: 65vw; width: 320px; flex-shrink: 0; }
.resize-handle { position: absolute; left: -3px; top: 0; width: 6px; height: 100%; cursor: col-resize; border-radius: 3px; transition: background 0.15s; }
.resize-handle:hover { background: var(--accent); opacity: 0.6; }
.news-img-preview { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface2); display: block; }
.news-img-preview-ph { width: 100%; aspect-ratio: 16/9; background: var(--surface2); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--muted2); font-size: 32px; }
.panel-title { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.tweet-box { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.tweet-textarea { background: none; border: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; min-height: 130px; width: 100%; }
.char-counter { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
.char-num { font-weight: 500; font-size: 16px; }
.char-num.ok { color: var(--success); }
.char-num.warn { color: var(--warning); }
.char-num.over { color: var(--danger); }
.char-bar { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.char-bar-fill { height: 100%; border-radius: 2px; transition: width 0.15s, background 0.15s; }
.btn-copy { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; justify-content: center; padding: 10px; font-size: 13px; width: 100%; }
.btn-copy:hover { background: var(--accent-dim); }
.btn-open-x { background: #000; color: #fff; border-color: #333; justify-content: center; padding: 9px; font-size: 13px; width: 100%; }
.btn-open-x:hover { background: #111; }
.copied-msg { text-align: center; font-size: 11px; color: var(--success); height: 14px; }
.panel-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; gap: 10px; }
.panel-empty svg { width: 30px; height: 30px; opacity: 0.2; }
.page { display: none; padding: 20px 24px; }
.page.active { display: block; }
.page-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-desc { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.feed-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; background: var(--bg); font-size: 12px; }
.feed-item span { flex: 1; word-break: break-all; }
.feed-del { background: none; border: none; cursor: pointer; color: var(--muted2); font-size: 16px; line-height: 1; transition: color 0.12s; }
.feed-del:hover { color: var(--danger); }
input[type="text"] { background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 12px; width: 100%; outline: none; transition: border-color 0.12s; }
input[type="text"]:focus { border-color: var(--accent); }
.add-row { display: flex; gap: 8px; margin-top: 8px; }
.spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <div>
      <div class="brand-name">TweetGen</div>
      <div class="brand-sub">@Mastv_hn · Más Televisión</div>
    </div>
  </div>
  <span id="top-status" style="font-size:11px;color:var(--muted)">Listo</span>
</div>

<div class="layout">

  <nav class="sidebar">
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="goTo('noticias',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 01-2.25 2.25M16.5 7.5V18a2.25 2.25 0 002.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 002.25 2.25h13.5M6 7.5h3v3H6v-3z"/></svg>
      Noticias
    </div>
    <div class="nav-item" onclick="goTo('feeds',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12.75 19.5v-.75a7.5 7.5 0 00-7.5-7.5H4.5m0-6.75h.75c7.87 0 14.25 6.38 14.25 14.25v.75M6 18.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg>
      Feeds RSS
    </div>
    <div class="nav-section">Fuentes</div>
    <div id="sidebar-feeds"></div>
  </nav>

  <div id="main-noticias" class="main-area">
    <div class="toolbar">
      <button class="btn btn-accent" onclick="loadNews()" id="btn-load">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Cargar noticias
      </button>
      <select class="sort-select" id="sort-select" onchange="sortAndRender()">
        <option value="recientes">Más recientes</option>
        <option value="largo">Titular más largo</option>
        <option value="corto">Titular más corto</option>
      </select>
      <span class="count-badge" id="count-badge" style="display:none">0</span>
    </div>
    <div id="news-grid" class="news-grid">
      <div class="empty-state">Haz clic en "Cargar noticias" para comenzar.</div>
    </div>
  </div>

  <div id="main-feeds" class="page" style="grid-column:2/4">
    <div class="page-title">Feeds RSS</div>
    <div class="page-desc">Agrega o elimina fuentes de noticias.</div>
    <div class="card">
      <div class="card-label">Fuentes activas</div>
      <div id="feed-list-ui"></div>
      <div class="add-row">
        <input type="text" id="new-feed-input" placeholder="https://sitio.com/feed" />
        <button class="btn btn-accent" onclick="addFeed()">+ Agregar</button>
      </div>
    </div>
  </div>

  <div class="panel" id="right-panel" style="position:relative">
    <div class="resize-handle" id="resize-handle"></div>
    <div class="panel-title">Tweet listo · 280 chars</div>
    <div id="panel-content" class="panel-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span>Selecciona una noticia<br>para generar el tweet</span>
    </div>
  </div>

</div>

<script>
const MAX = 280;
let feeds = JSON.parse(localStorage.getItem('tg_feeds') || '["https://web.colonaldia.hn/feed/"]');
let allItems = [];
let sortedItems = [];

function goTo(page, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const isNoticias = page === 'noticias';
  document.getElementById('main-noticias').style.display = isNoticias ? 'block' : 'none';
  document.getElementById('main-feeds').style.display = isNoticias ? 'none' : 'block';
  document.getElementById('right-panel').style.display = isNoticias ? 'flex' : 'none';
  if (!isNoticias) renderFeedList();
}

function renderSidebarFeeds() {
  document.getElementById('sidebar-feeds').innerHTML = feeds.map(f => {
    const h = (() => { try { return new URL(f).hostname.replace('www.',''); } catch(e) { return f; } })();
    return `<div class="feed-sidebar-item"><div class="feed-dot"></div>${h}</div>`;
  }).join('');
}

async function loadNews() {
  if (!feeds.length) { document.getElementById('top-status').textContent = 'Sin feeds.'; return; }
  const btn = document.getElementById('btn-load');
  btn.innerHTML = '<span class="spinner"></span> Cargando...';
  btn.disabled = true;
  document.getElementById('top-status').textContent = 'Cargando...';
  allItems = [];
  document.getElementById('panel-content').className = 'panel-empty';
  document.getElementById('panel-content').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span>Selecciona una noticia<br>para generar el tweet</span>`;

  for (const feed of feeds) {
    try {
      const res = await fetch(`/api/rss/fetch?url=${encodeURIComponent(feed)}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const source = (() => { try { return new URL(feed).hostname.replace('www.',''); } catch(e) { return feed; } })();
      Array.from(xml.querySelectorAll('item')).slice(0,15).forEach((item, i) => {
        const title = item.querySelector('title')?.textContent?.trim() || '';
        const link = item.querySelector('link')?.textContent?.trim() || '';
        const desc = (item.querySelector('description')?.textContent || '').replace(/<[^>]+>/g,'').trim();
        const pubDate = item.querySelector('pubDate')?.textContent || '';
        let img = '';
        const enc = item.querySelector('enclosure');
        if (enc?.getAttribute('type')?.startsWith('image')) img = enc.getAttribute('url') || '';
        if (!img) { const m = (item.querySelector('description')?.textContent||'').match(/src=["']([^"']+\.(jpg|jpeg|png|webp))['"]/i); if(m) img=m[1]; }
        if (title) allItems.push({ title, link, desc: desc.slice(0,300), img, source, pubDate, order: i });
      });
    } catch(e) { console.error(e); }
  }

  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Cargar noticias`;
  btn.disabled = false;

  if (!allItems.length) {
    document.getElementById('top-status').textContent = 'Sin resultados';
    document.getElementById('news-grid').innerHTML = '<div class="empty-state">No se encontraron noticias.</div>';
    return;
  }
  document.getElementById('top-status').textContent = `${allItems.length} noticias`;
  document.getElementById('count-badge').style.display = '';
  sortAndRender();
}

function sortAndRender() {
  const sort = document.getElementById('sort-select').value;
  sortedItems = [...allItems];
  if (sort === 'largo') sortedItems.sort((a,b) => b.title.length - a.title.length);
  else if (sort === 'corto') sortedItems.sort((a,b) => a.title.length - b.title.length);
  document.getElementById('count-badge').textContent = sortedItems.length + ' noticias';
  document.getElementById('news-grid').innerHTML = sortedItems.map((item, i) => `
    <div class="news-card" onclick="selectItem(${i})" id="nc-${i}">
      <div class="news-card-inner">
        ${item.img ? `<img class="news-thumb" src="${item.img}" alt="" onerror="this.style.display='none'" />` : `<div class="news-thumb-ph">📰</div>`}
        <div class="news-body">
          <div class="news-title">${item.title}</div>
          <div class="news-desc">${item.desc}</div>
          <div class="news-meta">${item.source}${item.pubDate ? ' · ' + fmtDate(item.pubDate) : ''}</div>
        </div>
      </div>
    </div>`).join('');
}

function fmtDate(s) {
  try { return new Date(s).toLocaleDateString('es-HN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return ''; }
}

function selectItem(i) {
  document.querySelectorAll('.news-card').forEach((c,j) => c.classList.toggle('selected', j===i));
  const item = sortedItems[i];
  const LINK_LEN = 23;
  const SEPARATORS = 4;
  const available = MAX - LINK_LEN - SEPARATORS;
  let title = item.title.trim();
  let desc = item.desc.replace(/\s+/g,' ').trim();
  const titleBudget = Math.floor(available * 0.6);
  if (title.length > titleBudget) title = title.slice(0, titleBudget - 1) + '…';
  const descBudget = available - title.length;
  if (desc.length > descBudget) desc = desc.slice(0, Math.max(0, descBudget - 1)) + '…';
  const tweet = `${title}\n\n${desc}\n\n${item.link}`;
  showPanel(tweet, item.img);
}

function showPanel(tweet, imgUrl) {
  const pc = document.getElementById('panel-content');
  pc.className = '';
  const imgHtml = imgUrl
    ? `<img class="news-img-preview" src="${imgUrl}" alt="" onerror="this.style.display='none'" />`
    : `<div class="news-img-preview-ph">📰</div>`;
  pc.innerHTML = `
    ${imgHtml}
    <div class="tweet-box">
      <textarea class="tweet-textarea" id="tweet-ta" oninput="updateCounter()">${tweet}</textarea>
      <div class="char-bar"><div class="char-bar-fill" id="char-fill"></div></div>
      <div class="char-counter">
        <span style="font-size:11px;color:var(--muted)">restantes</span>
        <span class="char-num ok" id="char-num">280</span>
      </div>
    </div>
    <button class="btn btn-copy" onclick="copyTweet()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copiar tweet
    </button>
    <button class="btn btn-open-x" onclick="window.open('https://x.com/compose/tweet','_blank')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      Abrir X para pegar
    </button>
    <div class="copied-msg" id="copied-msg"></div>`;
  updateCounter();
}

function updateCounter() {
  const ta = document.getElementById('tweet-ta');
  const numEl = document.getElementById('char-num');
  const fillEl = document.getElementById('char-fill');
  if (!ta || !numEl || !fillEl) return;
  let text = ta.value;
  const urls = text.match(/https?:\/\/\S+/g) || [];
  let counted = text;
  urls.forEach(u => { counted = counted.replace(u, '0'.repeat(23)); });
  const len = counted.length;
  const rem = MAX - len;
  numEl.textContent = rem;
  fillEl.style.width = Math.min(100,(len/MAX)*100) + '%';
  if (rem < 0) { numEl.className = 'char-num over'; fillEl.style.background = 'var(--danger)'; }
  else if (rem < 20) { numEl.className = 'char-num warn'; fillEl.style.background = 'var(--warning)'; }
  else { numEl.className = 'char-num ok'; fillEl.style.background = 'var(--success)'; }
}

function copyTweet() {
  const ta = document.getElementById('tweet-ta');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(() => {
    const m = document.getElementById('copied-msg');
    if (m) { m.textContent = '✓ Copiado'; setTimeout(() => m.textContent = '', 2000); }
  });
}

function renderFeedList() {
  const el = document.getElementById('feed-list-ui');
  if (!feeds.length) { el.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:8px 0">Sin feeds.</p>'; return; }
  el.innerHTML = feeds.map((f,i) => `<div class="feed-item"><span>${f}</span><button class="feed-del" onclick="removeFeed(${i})">×</button></div>`).join('');
}

function addFeed() {
  const inp = document.getElementById('new-feed-input');
  const url = inp.value.trim();
  if (!url || feeds.includes(url)) return;
  feeds.push(url);
  localStorage.setItem('tg_feeds', JSON.stringify(feeds));
  inp.value = '';
  renderFeedList();
  renderSidebarFeeds();
}

function removeFeed(i) {
  feeds.splice(i,1);
  localStorage.setItem('tg_feeds', JSON.stringify(feeds));
  renderFeedList();
  renderSidebarFeeds();
}

renderSidebarFeeds();
document.getElementById('main-feeds').style.display = 'none';
document.getElementById('main-noticias').style.display = 'block';

// Panel resize
const handle = document.getElementById('resize-handle');
const panel = document.getElementById('right-panel');
let isResizing = false, startX = 0, startW = 0;

handle.addEventListener('mousedown', e => {
  isResizing = true;
  startX = e.clientX;
  startW = panel.offsetWidth;
  handle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const delta = startX - e.clientX;
  const newW = Math.min(Math.max(240, startW + delta), window.innerWidth * 0.65);
  panel.style.width = newW + 'px';
  // Actualizar columna del layout
  document.getElementById('main-noticias').style.maxWidth = (window.innerWidth - 200 - newW) + 'px';
});

document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false;
  handle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// AUTO-CARGA al iniciar
window.addEventListener('load', () => {
  loadNews();
});

// AUTO-REFRESH cada 5 minutos con alerta de nuevas noticias
let knownGuids = new Set();
let autoRefreshInterval = null;

async function checkNewNews() {
  if (!feeds.length) return;
  const newGuids = new Set();
  for (const feed of feeds) {
    try {
      const res = await fetch(`/api/rss/fetch?url=${encodeURIComponent(feed)}`);
      if (!res.ok) continue;
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      Array.from(xml.querySelectorAll('item')).slice(0,15).forEach(item => {
        const guid = item.querySelector('guid')?.textContent || item.querySelector('link')?.textContent || '';
        if (guid) newGuids.add(guid);
      });
    } catch(e) {}
  }

  if (knownGuids.size === 0) {
    knownGuids = newGuids;
    return;
  }

  const nuevas = [...newGuids].filter(g => !knownGuids.has(g));
  if (nuevas.length > 0) {
    knownGuids = newGuids;
    showNewAlert(nuevas.length);
  }
}

function showNewAlert(count) {
  let alert = document.getElementById('new-alert');
  if (!alert) {
    alert = document.createElement('div');
    alert.id = 'new-alert';
    alert.style.cssText = `position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:10px 20px;border-radius:30px;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;cursor:pointer;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:opacity 0.3s;`;
    alert.onclick = () => { loadNews(); alert.remove(); };
    document.body.appendChild(alert);
  }
  alert.textContent = `${count} nueva${count>1?'s':''} noticia${count>1?'s':''} — clic para cargar`;
  setTimeout(() => { if (alert.parentNode) alert.style.opacity = '0.7'; }, 8000);
}

// Iniciar auto-refresh cada 5 minutos
autoRefreshInterval = setInterval(checkNewNews, 5 * 60 * 1000);
</script>
